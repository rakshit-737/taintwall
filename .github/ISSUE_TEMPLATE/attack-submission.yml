name: Attack submission
description: Propose a new prompt-injection technique for the corpus. This is a contribution, not a vulnerability report.
title: "[attack] <technique name>"
labels: ["corpus", "attack-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for contributing a technique. A payload is in scope only if its
        harm derives from the injection **mechanism**, not from the information it
        contains, and every target it references must be inert. See `SECURITY.md`.

        A working payload against an **unpatched, named third-party product** is not
        accepted here — report it to that vendor first.
  - type: input
    id: id_suggestion
    attributes:
      label: Suggested record id
      description: "Format TW-F<family>-<nnnn>, e.g. TW-F5-0013. A maintainer may renumber it."
      placeholder: TW-F5-0013
    validations:
      required: true
  - type: dropdown
    id: family
    attributes:
      label: Family
      options:
        - "F1 - instruction override / authority spoof"
        - "F2 - benign business-language override"
        - "F3a - invisible codepoints"
        - "F3b - hidden markup"
        - "F4 - client-render exfiltration"
        - "F5 - agent-action exfiltration"
        - "F6 - MCP tool-metadata poisoning"
        - "F7 - persistence / delayed trigger"
        - "F8 - confused deputy across trust tiers"
        - "F9 - tool-response / error poisoning"
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: Channel
      options: [web, email, file, tool_output, rag, mcp]
    validations:
      required: true
  - type: textarea
    id: payload
    attributes:
      label: Payload
      description: The attack text. Every URL, email domain, and IP must be inert.
      render: text
    validations:
      required: true
  - type: input
    id: source_name
    attributes:
      label: Source name
      placeholder: hand-authored, or the name of the disclosure
    validations:
      required: true
  - type: input
    id: source_url
    attributes:
      label: Source URL
    validations:
      required: true
  - type: dropdown
    id: source_license
    attributes:
      label: Source licence
      options: ["CC-BY-4.0", "MIT", "Apache-2.0", "CC0-1.0", "other (explain below)"]
    validations:
      required: true
  - type: checkboxes
    id: attestations
    attributes:
      label: Attestations
      options:
        - label: "This payload's harm derives from the injection mechanism, not from information it contains."
          required: true
        - label: "Every target the payload references is inert (*.invalid, example.com/org/net, TEST-NET ranges, or localhost)."
          required: true
        - label: "This is not a working payload against an unpatched, named third-party product."
          required: true
