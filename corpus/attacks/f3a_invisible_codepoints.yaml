# Family F3a - invisible codepoints.
#
# The directive is legible to the tokenizer and invisible to a human reviewer:
# Unicode tag block (U+E0000-E007F), zero-width characters, variation selectors,
# bidi overrides, and homoglyphs. Every payload here is stored base64 so the YAML
# file stays ASCII-clean and cannot self-corrupt on save. Use taintwall.render
# .visualize to see what a payload actually carries.
#
# Split from F3b (hidden markup) on purpose: a codepoint filter and an HTML/PDF
# parser are completely different detectors, and merging them would average two
# unrelated results in the per-family breakdown.
records:
